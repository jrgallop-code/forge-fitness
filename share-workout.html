<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Open Level Up Workout</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% -10%,rgba(239,24,33,.15),transparent 30rem),#09090b;color:#f7f7f8}
    main{width:min(100%,430px);padding:28px 22px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#151519;box-shadow:0 24px 70px rgba(0,0,0,.42);text-align:center}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:17px;background:#df141e;color:#fff;font-size:29px;font-weight:950;letter-spacing:-.06em}
    h1{margin:0;font-size:28px;letter-spacing:-.04em}
    p{margin:10px auto 22px;color:#b8b8c0;font-size:15px;line-height:1.5}
    a,button{width:100%;min-height:50px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}
    button{border:0;background:#df141e;color:#fff}
    a{display:grid;place-items:center;margin-top:10px;border:1px solid rgba(255,255,255,.12);background:#242429;color:#fff;text-decoration:none}
    small{display:block;margin-top:18px;color:#85858e;font-size:12px;line-height:1.45}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L</div>
    <h1>Shared Level Up Workout</h1>
    <p id="copy">Open this workout in the Level Up iPhone app, then review it before adding it to My Workouts.</p>
    <button id="open" type="button">Open in Level Up</button>
    <a id="store" href="https://apps.apple.com/ca/app/level-up-workout-nutrition/id6810024008">Get Level Up on the App Store</a>
    <small id="status">If Level Up is already installed, tap “Open in Level Up.”</small>
  </main>
  <script>
    (() => {
      const token = new URLSearchParams(location.search).get("data") || "";
      const valid = /^[A-Za-z0-9_-]{20,100000}$/.test(token);
      const button = document.getElementById("open");
      const status = document.getElementById("status");
      if (!valid) {
        button.hidden = true;
        document.getElementById("copy").textContent = "This workout link is incomplete or no longer valid.";
        status.textContent = "Ask the sender to share the workout again.";
        return;
      }
      const deepLink = "leveluphypertrophy://workout/import?data=" + token;
      button.addEventListener("click", () => {
        status.textContent = "Opening Level Up…";
        location.href = deepLink;
      });
    })();
  </script>
</body>
</html>
