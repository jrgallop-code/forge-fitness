<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#09090b">
  <title>Level Up Workout Preview</title>
  <script>
    (()=>{try{
      const raw=JSON.parse(localStorage.getItem('level_up_appearance_settings')||'null');
      const selected=String(raw?.theme||raw||'level-up');
      const allowed=['system','level-up','arctic','pure','ocean','midnight','slate','pulse'];
      const pref=allowed.includes(selected)?selected:'level-up';
      const hour=new Date().getHours();
      const effective=pref==='system'?(hour>=7&&hour<19?'arctic':'level-up'):pref;
      const mode=['arctic','pure','ocean'].includes(effective)?'light':'dark';
      document.documentElement.dataset.themePreference=pref;
      document.documentElement.dataset.theme=effective;
      document.documentElement.dataset.themeMode=mode;
      document.documentElement.style.colorScheme=mode;
    }catch{}})();
  </script>
