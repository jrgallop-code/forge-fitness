<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#09090b">
  <title>Level Up Owner Analytics</title>
  <meta name="description" content="Private Level Up owner analytics dashboard.">
  <link rel="stylesheet" href="./admin.css?v=owner-dashboard-1">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="owner-shell">
    <header class="owner-topbar">
      <a class="owner-brand" href="https://leveluphypertrophy.com" aria-label="Level Up home">
        <span class="owner-mark" aria-hidden="true">LU</span>
        <span><strong>LEVEL UP</strong><small>OWNER CONSOLE</small></span>
      </a>
      <div class="owner-account-actions">
        <span class="owner-security-badge">PRIVATE</span>
        <button id="owner-signout" class="owner-signout" type="button" hidden>Sign out</button>
      </div>
    </header>

    <main id="owner-root" class="owner-root" aria-live="polite">
      <section class="owner-login-card">
        <span class="eyebrow">OWNER ACCESS</span>
        <h1>Level Up Analytics</h1>
        <p>Sign in with the Level Up owner account to open the private analytics console.</p>
        <div id="owner-google-button" class="owner-google-button"></div>
        <div id="owner-auth-status" class="owner-auth-status">Checking owner access…</div>
      </section>
    </main>
  </div>
  <script type="module" src="./app.js?v=owner-dashboard-2"></script>
</body>
</html>
