name: iOS App Store Release

on:
  workflow_dispatch:
  push:
    branches:
      - ios/capacitor-app-store
    paths:
      - .github/release-ios-now

permissions:
  contents: read

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Sign and upload to App Store Connect
    runs-on: macos-26
    timeout-minutes: 45
    environment: app-store

    steps:
      - name: Check out Level Up
        uses: actions/checkout@v4

      - name: Verify protected Apple credentials
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for variable in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required app-store environment secret: $variable"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run cap:sync:ios

      - name: Run iOS packaging checks
        run: node --test tests/capacitor-ios-packaging.test.mjs tests/ios-cloud-build.test.mjs tests/native-app-shell.test.mjs

      - name: Create temporary App Store Connect key
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          echo "AUTH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Create temporary App Store signing assets
        id: signing
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_IDENTIFIER: com.leveluphypertrophy.app
          APP_EXTENSION_BUNDLE_IDENTIFIER: com.leveluphypertrophy.app.timer
          SIGNING_DIR: ${{ runner.temp }}/level-up-signing
        run: |
          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "SIGNING_STATE_PATH=$SIGNING_DIR/state.json" >> "$GITHUB_ENV"
          node scripts/app-store-signing.mjs create

          signing_password="$(openssl rand -hex 24)"
          signing_keychain="$RUNNER_TEMP/level-up-signing.keychain-db"
          certificate_pem="$SIGNING_DIR/distribution.pem"
          certificate_p12="$SIGNING_DIR/distribution.p12"

          openssl x509 -inform DER -in "$SIGNING_DIR/distribution.cer" -out "$certificate_pem"
          openssl pkcs12 -export -legacy \
            -inkey "$SIGNING_DIR/distribution.key" \
            -in "$certificate_pem" \
            -out "$certificate_p12" \
            -passout "pass:$signing_password"

          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$certificate_p12" -k "$signing_keychain" -P "$signing_password" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain" login.keychain-db

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          profile_uuid="$(security cms -D -i "$SIGNING_DIR/LevelUp_AppStore.mobileprovision" | plutil -extract UUID raw -)"
          installed_profile="$profile_directory/$profile_uuid.mobileprovision"
          cp "$SIGNING_DIR/LevelUp_AppStore.mobileprovision" "$installed_profile"

          timer_profile_uuid="$(security cms -D -i "$SIGNING_DIR/LevelUp_Timer_AppStore.mobileprovision" | plutil -extract UUID raw -)"
          installed_timer_profile="$profile_directory/$timer_profile_uuid.mobileprovision"
          cp "$SIGNING_DIR/LevelUp_Timer_AppStore.mobileprovision" "$installed_timer_profile"

          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          echo "INSTALLED_PROFILE_PATH=$installed_profile" >> "$GITHUB_ENV"
          echo "INSTALLED_TIMER_PROFILE_PATH=$installed_timer_profile" >> "$GITHUB_ENV"
          echo "APP_STORE_PROFILE_NAME=Level Up App Store $GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "TIMER_EXTENSION_PROFILE_NAME=Level Up Timer App Store $GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Archive signed Level Up app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/LevelUp.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          APP_STORE_PROFILE_NAME="$APP_STORE_PROFILE_NAME"
          TIMER_EXTENSION_PROFILE_NAME="$TIMER_EXTENSION_PROFILE_NAME"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          -allowProvisioningUpdates
          -authenticationKeyPath "$AUTH_KEY_PATH"
          -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
          -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          clean archive

      - name: Create App Store export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string export "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert signingCertificate -string "Apple Distribution" "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          plutil -insert provisioningProfiles -xml \
            "<dict><key>com.leveluphypertrophy.app</key><string>$APP_STORE_PROFILE_NAME</string><key>com.leveluphypertrophy.app.timer</key><string>$TIMER_EXTENSION_PROFILE_NAME</string></dict>" \
            "$export_options"
          plutil -insert uploadSymbols -bool true "$export_options"
          echo "EXPORT_OPTIONS_PATH=$export_options" >> "$GITHUB_ENV"

      - name: Export signed IPA
        run: >-
          xcodebuild
          -exportArchive
          -archivePath "$RUNNER_TEMP/LevelUp.xcarchive"
          -exportPath "$RUNNER_TEMP/LevelUpExport"
          -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

      - name: Upload build to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa_path="$(find "$RUNNER_TEMP/LevelUpExport" -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "No IPA was produced."
            exit 1
          fi
          xcrun altool --upload-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove temporary Apple credential
        if: always()
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node scripts/app-store-signing.mjs cleanup
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${INSTALLED_TIMER_PROFILE_PATH:-}" ]]; then
            rm -f "$INSTALLED_TIMER_PROFILE_PATH"
          fi
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${SIGNING_DIR:-}" ]]; then
            rm -rf "$SIGNING_DIR"
          fi
          if [[ -n "${AUTH_KEY_PATH:-}" ]]; then
            rm -f "$AUTH_KEY_PATH"
          fi
