name: Inspect App Store signing certificates
# Read-only certificate check for AI meal-photo TestFlight release; never revokes assets.

on:
  workflow_dispatch:
  push:
    branches: [ios/capacitor-app-store]
    paths: [.github/workflows/ios-certificate-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    name: Read-only Apple Distribution inventory
    runs-on: ubuntu-latest
    environment: app-store
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect certificates without creating or revoking
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          umask 077
          export AUTH_KEY_PATH="$(mktemp)"
          trap 'rm -f "$AUTH_KEY_PATH"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$AUTH_KEY_PATH"
          node scripts/app-store-signing.mjs inspect-certificates
