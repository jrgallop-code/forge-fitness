name: FatSecret integration checks

on:
  pull_request:
    paths:
      - "cloud/src/fatsecret-*.js"
      - "cloud/wrangler.jsonc"
      - "js/nutrition/fatsecret-live-cache.js"
      - "js/nutrition/food-log-data.js"
      - "js/nutrition/food-log-data-core.js"
      - "tests/fatsecret-*.test.mjs"
      - ".github/workflows/test-fatsecret.yml"
  push:
    branches:
      - main
    paths:
      - "cloud/src/fatsecret-*.js"
      - "cloud/wrangler.jsonc"
      - "js/nutrition/fatsecret-live-cache.js"
      - "js/nutrition/food-log-data.js"
      - "js/nutrition/food-log-data-core.js"
      - "tests/fatsecret-*.test.mjs"
      - ".github/workflows/test-fatsecret.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check module syntax
        run: |
          node --check cloud/src/fatsecret-food-provider.js
          node --check cloud/src/fatsecret-enabled-worker.js
          node --check js/nutrition/fatsecret-live-cache.js
          node --check js/nutrition/food-log-data.js
      - name: Run FatSecret regression tests
        run: node --test tests/fatsecret-provider.test.mjs tests/fatsecret-live-integration.test.mjs
