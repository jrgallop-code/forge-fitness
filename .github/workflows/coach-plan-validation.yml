name: Coach plan safety checks
on:
  pull_request:
    paths:
      - 'js/nutrition/coach-managed-targets.js'
      - 'js/nutrition/nutrition-storage.js'
      - 'js/nutrition/maintenance-check-in.js'
      - 'js/more/coach-assigned-programs.js'
      - 'cloud/src/coach-assignments.js'
      - 'cloud/src/index.js'
      - 'cloud/migrations/*coach*.sql'
      - 'tests/coach-assignment-api.test.mjs'
      - 'tests/coach-schema-smoke.py'
      - 'tests/coach-real-sql-integration.test.mjs'
      - 'js/dashboard/nutrition-target-card.js'
      - 'js/dashboard/dashboard-nutrition-sync.js'
      - 'js/nutrition/active-plan-display-sync.js'
      - 'js/progress/weight-tracker.js'
      - 'js/progress/weight-trend-chart.js'
      - 'js/dashboard/dashboard-goal-timeline.js'
      - 'js/nutrition/energy-profile.js'
      - 'js/core/current-goal.js'
      - 'js/core/router.js'
      - 'js/more/more-ui-v2.js'
      - 'js/more/account-cloud-ui.js'
      - 'tests/coach-managed-targets.test.mjs'
      - '.github/workflows/coach-plan-validation.yml'
  workflow_dispatch:
jobs:
  coach-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check js/nutrition/coach-managed-targets.js
      - run: node --check js/nutrition/nutrition-storage.js
      - run: node --check js/more/coach-assigned-programs.js
      - run: node --check cloud/src/coach-assignments.js
      - run: node --check js/progress/weight-tracker.js
      - run: node --check js/progress/weight-trend-chart.js
      - run: node --check js/dashboard/dashboard-goal-timeline.js
      - run: node --check js/nutrition/energy-profile.js
      - run: node --test tests/coach-managed-targets.test.mjs tests/coach-assignment-api.test.mjs tests/coach-real-sql-integration.test.mjs
      - run: python3 tests/coach-schema-smoke.py
      - name: Install isolated Cloudflare D1 CLI
        run: npm ci --prefix cloud
      - name: Apply migrations to disposable local D1 (never remote)
        run: |
          set -euo pipefail
          cd cloud
          npx wrangler d1 migrations apply DB --local --persist-to /tmp/coach-d1-staging
          npx wrangler d1 execute DB --local --persist-to /tmp/coach-d1-staging --command "SELECT name FROM sqlite_master WHERE name IN ('coach_training_links','coach_program_assignments','coach_assignment_versions','coach_assignment_decisions','coach_client_nutrition_selection') ORDER BY name;" --json > /tmp/coach-d1-tables.json
          node -e 'const fs=require("fs"); const s=JSON.stringify(JSON.parse(fs.readFileSync("/tmp/coach-d1-tables.json","utf8"))); for(const n of ["coach_training_links","coach_program_assignments","coach_assignment_versions","coach_assignment_decisions","coach_client_nutrition_selection"])if(!s.includes(n))throw Error("D1 migration missing "+n); console.log("Isolated D1 coach schema verified")'
      - name: Run full suite (baseline checked separately)
        run: npm test > /tmp/coach-branch-tests.log 2>&1 || true
      - name: Compare existing failure baseline
        shell: bash
        run: |
          set -euo pipefail
          grep '^not ok [0-9]* - ' /tmp/coach-branch-tests.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/coach-branch-failures.txt || true
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach /tmp/levelup-coach-baseline "${{ github.event.pull_request.base.sha }}"
          (cd /tmp/levelup-coach-baseline && npm ci && npm test > /tmp/coach-baseline-tests.log 2>&1) || true
          grep '^not ok [0-9]* - ' /tmp/coach-baseline-tests.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/coach-baseline-failures.txt || true
          echo "Current branch failures: $(wc -l < /tmp/coach-branch-failures.txt)"
          echo "Base branch failures: $(wc -l < /tmp/coach-baseline-failures.txt)"
          echo "New failing tests not present on base:"
          comm -23 /tmp/coach-branch-failures.txt /tmp/coach-baseline-failures.txt | tee /tmp/coach-new-failures.txt
          test ! -s /tmp/coach-new-failures.txt
