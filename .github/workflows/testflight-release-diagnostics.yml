name: TestFlight release diagnostics
on:
  pull_request:
    branches: [ios/capacitor-app-store]
    paths: ['.github/workflows/testflight-release-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Print recent iOS release results and failed job steps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows/ios-app-store.yml/runs?per_page=12" --jq '.workflow_runs[]|{id,run_number,status,conclusion,created_at,head_sha,event,html_url}'
          for id in $(gh api "repos/$GH_REPO/actions/workflows/ios-app-store.yml/runs?per_page=6" --jq '.workflow_runs[].id'); do
            echo "RELEASE RUN $id"
            gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" --jq '.jobs[]|{id,name,status,conclusion,failed_steps:[.steps[]|select(.conclusion=="failure")|.name]}' || true
          done

# Read-only audit refresh for Steps tab TestFlight release, November 15 2026.

