name: Inspect iOS signing certificates

on:
  workflow_dispatch:
  push:
    branches:
      - ios/capacitor-app-store
    paths:
      - .github/workflows/ios-signing-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    name: Read Apple Distribution certificate inventory
    runs-on: ubuntu-latest
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect certificates without modifying Apple signing assets
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          auth_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$auth_key_path"
          chmod 600 "$auth_key_path"
          export AUTH_KEY_PATH="$auth_key_path"
          trap 'rm -f "$auth_key_path"' EXIT
          node scripts/app-store-signing.mjs inspect-certificates
# Read-only certificate inventory refresh for Gym Tools plate-calculator release — 2026-11-19.
