name: Form video audit

on:
  push:
    branches:
      - fix/dashboard-spacing-and-form-video-audit
    paths:
      - "scripts/form-video-audit.mjs"
      - ".github/workflows/audit-form-videos.yml"
      - "js/workouts/exercise-library.js"
      - "js/workouts/exercise-library-expansion.js"
      - "js/workouts/exercise-guide-video-manifest.js"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit form guide videos
        run: node scripts/form-video-audit.mjs
