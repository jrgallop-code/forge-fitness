name: iOS Capacitor Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios/capacitor-app-store
    paths:
      - .github/workflows/ios-capacitor.yml
      - .github/workflows/ios-app-store.yml
      - assets/**
      - capacitor.config.json
      - css/**
      - index.html
      - ios/**
      - js/**
      - package.json
      - package-lock.json
      - tests/capacitor-ios-packaging.test.mjs
      - tests/ios-cloud-build.test.mjs
      - tests/native-app-shell.test.mjs
      - tools/build-native.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ios-capacitor.yml
      - .github/workflows/ios-app-store.yml
      - assets/**
      - capacitor.config.json
      - css/**
      - index.html
      - ios/**
      - js/**
      - package.json
      - package-lock.json
      - tests/capacitor-ios-packaging.test.mjs
      - tests/ios-cloud-build.test.mjs
      - tests/native-app-shell.test.mjs
      - tools/build-native.mjs

permissions:
  contents: read

concurrency:
  group: ios-capacitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS on Xcode 26
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out Level Up
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync the PWA into Capacitor
        run: npm run cap:sync:ios

      - name: Configure Spotify app identifier
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re
          from pathlib import Path
          client_id = os.environ.get("SPOTIFY_CLIENT_ID", "").strip()
          if client_id and not re.fullmatch(r"[a-fA-F0-9]{32}", client_id):
              raise SystemExit("Invalid SPOTIFY_CLIENT_ID")
          path = Path("ios/App/App/Info.plist")
          data = plistlib.loads(path.read_bytes())
          print("Spotify connection configured:", bool(client_id))
          data["SpotifyClientID"] = client_id
          path.write_bytes(plistlib.dumps(data))
          PY

      - name: Run iOS packaging checks
        run: node --test tests/spotify-pr-tagging.test.mjs tests/capacitor-ios-packaging.test.mjs tests/native-app-shell.test.mjs

      - name: Report Apple toolchain
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
