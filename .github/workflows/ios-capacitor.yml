name: iOS Capacitor Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios/capacitor-foundation
    paths:
      - .github/workflows/ios-capacitor.yml
      - assets/**
      - capacitor.config.json
      - css/**
      - index.html
      - ios/**
      - js/**
      - package.json
      - package-lock.json
      - tools/build-native.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ios-capacitor.yml
      - assets/**
      - capacitor.config.json
      - css/**
      - index.html
      - ios/**
      - js/**
      - package.json
      - package-lock.json
      - tools/build-native.mjs

permissions:
  contents: read

concurrency:
  group: ios-capacitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS on Xcode 26
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out Level Up
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync the PWA into Capacitor
        run: npm run cap:sync:ios

      - name: Run iOS packaging checks
        run: node --test tests/capacitor-ios-packaging.test.mjs tests/native-app-shell.test.mjs

      - name: Report Apple toolchain
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
