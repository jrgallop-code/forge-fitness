name: Validate nonblocking nutrition cache
on:
  push:
    branches:
      - fix/ios-expenditure-last-good-snapshot-20261019
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/nutrition/calorie-stats.js
      - run: node --check js/nutrition/calculated-maintenance.js
      - run: node --test tests/fatsecret-startup-expenditure-guard.test.mjs tests/fatsecret-progress-calories.test.mjs
