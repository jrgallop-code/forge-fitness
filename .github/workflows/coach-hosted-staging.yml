name: Level Up Coach Hosted Staging
on:
  push:
    branches:
      - feature/coach-plan-approval-v1
    paths:
      - '.github/workflows/coach-hosted-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: level-up-coach-staging-isolated
  cancel-in-progress: false
jobs:
  hosted-staging:
    name: Isolated Cloudflare Worker & D1 staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Wrangler
        run: npm ci --prefix cloud
      - name: Verify staging credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Cloudflare GitHub Actions credentials are unavailable; staging is not deployed."
            exit 1
          fi
      - name: Provision isolated staging database (never production)
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_NAME: level-up-coach-staging-20261113
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/coach-staging-databases.json
          if ! node -e '
            const fs=require("fs");const dbs=JSON.parse(fs.readFileSync("/tmp/coach-staging-databases.json"));
            const row=dbs.find(x=>x.name===process.env.STAGING_DATABASE_NAME);
            process.exit(row?0:1);
          '; then
            npx wrangler d1 create "$STAGING_DATABASE_NAME" --location enam --binding DB >/tmp/coach-d1-create.log
          fi
          npx wrangler d1 list --json > /tmp/coach-staging-databases.json
          node --input-type=module -e '
            import fs from "node:fs";
            const dbs=JSON.parse(fs.readFileSync("/tmp/coach-staging-databases.json"));
            const stage=dbs.find(d=>d.name===process.env.STAGING_DATABASE_NAME);
            const base=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
            const live=base.d1_databases?.[0]?.database_id;
            if(!stage?.uuid || !live || stage.uuid===live || stage.name===base.d1_databases[0].database_name)throw Error("Staging D1 isolation verification failed");
            const allowed=String(base.vars?.ALLOWED_ORIGINS||"").split(",").filter(x=>x.includes("level-up-coach-private-preview")||x==="capacitor://localhost");
            const config={
              name:"level-up-coach-staging-20261113",
              main:base.main,
              compatibility_date:base.compatibility_date,
              compatibility_flags:base.compatibility_flags,
              workers_dev:true,
              vars:{...base.vars,ALLOWED_ORIGINS:allowed.join(","),ADMIN_EMAILS:"coach@example.test"},
              d1_databases:[{binding:"DB",database_name:stage.name,database_id:stage.uuid,migrations_dir:"migrations"}]
            };
            fs.writeFileSync("wrangler.coach-staging.json",JSON.stringify(config,null,2));
            fs.appendFileSync(process.env.GITHUB_ENV,"STAGING_D1_NAME="+stage.name+"\nSTAGING_D1_ID="+stage.uuid+"\n");
            console.log("Verified staging D1 distinct from production. Staging DB ID is recorded in workflow environment.");
          '
      - name: Migrate ONLY isolated remote staging D1
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.coach-staging.json"));if(c.d1_databases[0].database_name!=="level-up-coach-staging-20261113")process.exit(1)'
          npx wrangler d1 migrations apply DB --remote --config wrangler.coach-staging.json
      - name: Deploy ONLY separate staging Worker
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.coach-staging.json | tee /tmp/coach-staging-deployment.log
          if ! grep -Eq 'level-up-coach-staging-20261113.*workers.dev' /tmp/coach-staging-deployment.log; then
            echo "::error::Staging Worker URL not confirmed"
            exit 1
          fi
      - name: Seed ephemeral test accounts and test hosted HTTP lifecycle
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export COACH_TEST_TOKEN="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          export ATHLETE_TEST_TOKEN="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$COACH_TEST_TOKEN"
          echo "::add-mask::$ATHLETE_TEST_TOKEN"
          export COACH_BASE_URL="$(grep -Eo 'https://level-up-coach-staging-20261113[^[:space:]]*workers.dev' /tmp/coach-staging-deployment.log | head -n 1)"
          if [ -z "$COACH_BASE_URL" ]; then
            echo "::error::No isolated staging URL available"
            exit 1
          fi
          node ../tests/coach-local-http-e2e.mjs seed
          # Ensure synthetic fixture has no stale prior session or coach data.
          npx wrangler d1 execute DB --remote --config wrangler.coach-staging.json --command "DELETE FROM users WHERE id IN ('11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222');"
          npx wrangler d1 execute DB --remote --config wrangler.coach-staging.json --file /tmp/coach-local-e2e-seed.sql
          finish() {
            npx wrangler d1 execute DB --remote --config wrangler.coach-staging.json --command "DELETE FROM users WHERE id IN ('11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222');" >/dev/null || true
          }
          trap finish EXIT
          node ../tests/coach-local-http-e2e.mjs run
          echo "Hosted staging endpoint verified: $COACH_BASE_URL"
          echo "STAGING_COACH_URL=$COACH_BASE_URL" >> "$GITHUB_ENV"
      - name: Summarize safe staging result
        if: success()
        run: |
          echo "### Level Up Coach Hosted Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated Cloudflare Worker, staging D1 migrations and authenticated HTTP coach lifecycle passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: $STAGING_COACH_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Worker and production D1 were not modified." >> "$GITHUB_STEP_SUMMARY"
