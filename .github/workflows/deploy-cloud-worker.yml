name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/deploy-cloud-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: level-up-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          wranglerVersion: "4.127.0"
          command: d1 migrations apply DB --remote

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          wranglerVersion: "4.127.0"
          command: deploy
