name: Verify PWA coach invitation live
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-pwa-coach-live.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published PWA and invitation landing
        shell: bash
        run: |
          set -euo pipefail
          for path in "https://app.leveluphypertrophy.com/js/more/coach-invite-pwa.js" "https://leveluphypertrophy.com/coach-join.html"; do
            echo "Checking $path"
            curl -fSL --retry 6 --retry-delay 5 --max-time 25 -H "Cache-Control: no-cache" "$path" -o /tmp/check-public.html
            if [[ "$path" == *coach-invite-pwa.js ]]; then
              grep -q 'confirmContactEmailMismatch' /tmp/check-public.html
              grep -q 'Connect to your coach' /tmp/check-public.html
              grep -q 'clean.searchParams.delete("invite")' /tmp/check-public.html
            else
              grep -q '/assets/level-up-logo.svg' /tmp/check-public.html
            fi
          done
      - name: Verify Apple web sign-in route and gated UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Cache-Control: no-cache" "https://leveluphypertrophy.com/coach-join.html" -o /tmp/coach-apple-live.html
          grep -q 'id="appleLogin"' /tmp/coach-apple-live.html
          grep -q '/assets/level-up-logo.svg' /tmp/coach-apple-live.html
          ! grep -q 'This PWA-first test' /tmp/coach-apple-live.html
          curl -fsSL 'https://leveluphypertrophy.com/assets/level-up-logo.svg' | grep -q 'Level Up hypertrophy training app logo'
          grep -q '/v1/session/apple/existing' /tmp/coach-apple-live.html
          curl -fsSL "https://api.leveluphypertrophy.com/v1/coach/apple-web/config" -o /tmp/coach-apple-config.json
          node -e 'const d=require("/tmp/coach-apple-config.json");if(typeof d.enabled!=="boolean")throw Error("Apple config response invalid");console.log("Apple web login configuration enabled:",d.enabled)'
      - name: Read Cloudflare production deploy status without secrets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows/deploy-cloud-worker.yml/runs?branch=main&per_page=6" --jq '.workflow_runs[]|{id,status,conclusion,head_sha,created_at,html_url}'
      - name: Confirm public API is reachable and authentication-required
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/coach-check-api.json -w "%{http_code}" "https://api.leveluphypertrophy.com/v1/me")
          test "$code" = "401"
          echo "Public API requires authentication (HTTP $code)."

# Read-only refresh to verify newly configured Apple Services ID for Level Up coaching.
