name: Coach required-consent review
on:
  push:
    branches:
      - feature/coach-required-consent-disclosure-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consent permission and invitation tests
        run: node --test tests/coach-required-consent.test.mjs
      - name: Consent page syntax and backend syntax
        run: |
          node --check cloud/src/coach-invitations.js
          node -e "const fs=require('fs');const html=fs.readFileSync('coach-join.html','utf8');const script=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];if(!script)throw Error('missing coach join script');new Function(script);"
