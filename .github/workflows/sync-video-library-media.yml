name: Validate exercise demonstration videos
on:
  push:
    branches: [ios/capacitor-app-store]
    paths: [tools/sync-video-library-media.py, .github/workflows/sync-video-library-media.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Validate direct MP4 playback
        run: python tools/sync-video-library-media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-media-sync-report
          path: video-media-sync-report.json
