name: Sync exercise demonstration videos
on:
  push:
    branches: [ios/capacitor-app-store]
    paths: [tools/sync-video-library-media.py, .github/workflows/sync-video-library-media.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install video transfer tools
        run: |
          pip install gdown
          npm install --no-save wrangler@4.127.0
      - name: Transfer and validate demonstration clips
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/sync-video-library-media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-media-sync-report
          path: video-media-sync-report.json
