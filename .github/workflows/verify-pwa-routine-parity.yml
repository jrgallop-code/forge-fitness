name: PWA routine builder parity checks
on:
  push:
    branches:
      - pwa/ios-routine-builder-parity-safe-20261020
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          node --check js/workouts/workouts.js
          node --check js/workouts/manual-plan-setup.js
          node --check js/workouts/manual-builder-catalogue.js
          node --test tests/routine-builder-model.test.mjs
