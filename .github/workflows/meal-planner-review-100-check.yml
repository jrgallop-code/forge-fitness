name: Validate Meal Planner first 100 recipe review
on:
  push:
    branches: [ios/capacitor-app-store]
    paths:
      - .github/workflows/meal-planner-review-100-check.yml
      - js/nutrition/mpm-review-first-100*.js
      - js/nutrition/meal-planner-catalog-ui.js
      - js/nutrition/meal-planner-ui.js
      - tests/meal-planner-review-first-100.test.mjs
      - tests/meal-prep-manual-discovery.test.mjs
      - tests/meal-planner-source-batch-2.test.mjs
      - tests/meal-planner-catalog.test.mjs
      - tests/food-log-meals-ui.test.mjs
      - tests/meal-planner-cooking-measures.test.mjs tests/meal-planner-home-ios.test.mjs
      - tests/meal-planner-home-ios.test.mjs
      - tests/meal-planner-persistent-nav-batch.test.mjs
      - tests/meal-planner-consumption.test.mjs
      - tests/meal-planner-manual-scheduling.test.mjs
      - js/nutrition/meal-planner-consumption.js
      - js/nutrition/meal-planner-manual.js
      - assets/meal-photos/featured8-hq.avif
      - assets/meal-photos/base20-29-hq.avif
      - js/nutrition/meal-planner-home.js
      - css/meal-planner-catalog-polish.css
      - js/nutrition/meal-planner-measurements.js
      - js/nutrition/meal-planner-photos.js
      - js/nutrition/food-log.js
      - js/core/router.js
      - tests/meal-planner-unique-image-regression.test.mjs
      - tests/meal-planner-cooking-measures.test.mjs
      - js/nutrition/meal-planner-measurements.js
      - js/nutrition/food-log.js
      - css/ios-nutrition-polish.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify catalogue and first 100 review controls
        run: |
          node --test tests/meal-planner-consumption.test.mjs tests/meal-planner-review-first-100.test.mjs tests/meal-prep-manual-discovery.test.mjs tests/meal-planner-manual-scheduling.test.mjs tests/meal-planner-source-batch-2.test.mjs tests/meal-planner-catalog.test.mjs tests/food-log-meals-ui.test.mjs tests/meal-planner-unique-image-regression.test.mjs tests/meal-planner-cooking-measures.test.mjs tests/meal-planner-cooking-measures.test.mjs tests/meal-planner-persistent-nav-batch.test.mjs
      - name: Verify updated front-end JavaScript syntax
        run: |
          node --check js/nutrition/food-log.js
          node --check js/nutrition/meal-planner-ui.js
          node --check js/nutrition/meal-planner-catalog-ui.js
          node --check js/nutrition/meal-planner-measurements.js
          node --check js/nutrition/meal-planner-measurements.js
          node --check js/nutrition/meal-planner-photos.js
          node --check js/nutrition/featured-unique-photos.js
          node --check js/nutrition/mpm-review-first-100.js
          node --check js/nutrition/mpm-review-first-100-generated.js
