name: Finalize workout complete arm asset

on:
  push:
    branches:
      - agent/bicep-workout-complete-hero

permissions:
  contents: write

jobs:
  finalize-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bicep-workout-complete-hero
          fetch-depth: 0

      - name: Reassemble and validate transparent WebP
        run: |
          cat .tmp-workout-arm/00 .tmp-workout-arm/01 .tmp-workout-arm/02 .tmp-workout-arm/03 .tmp-workout-arm/04 .tmp-workout-arm/05 .tmp-workout-arm/06 .tmp-workout-arm/07 > /tmp/workout-arm.b64
          python - <<'PY'
          from pathlib import Path
          import base64

          encoded = Path('/tmp/workout-arm.b64').read_text(encoding='ascii')
          data = base64.b64decode(encoded, validate=True)

          assert len(data) == 43080, f'Unexpected WebP size: {len(data)}'
          assert data[:4] == b'RIFF', 'Missing RIFF signature'
          assert data[8:12] == b'WEBP', 'Missing WEBP signature'
          assert int.from_bytes(data[4:8], 'little') + 8 == len(data), 'RIFF size mismatch'
          assert data[12:16] == b'VP8X', 'Expected VP8X WebP'
          assert data[20] & 0x10, 'Expected alpha/transparency flag'

          width = 1 + int.from_bytes(data[24:27], 'little')
          height = 1 + int.from_bytes(data[27:30], 'little')
          assert (width, height) == (420, 350), f'Unexpected dimensions: {width}x{height}'

          chunks = []
          pos = 12
          while pos < len(data):
            assert pos + 8 <= len(data), f'Truncated chunk header at {pos}'
            fourcc = data[pos:pos+4].decode('ascii')
            size = int.from_bytes(data[pos+4:pos+8], 'little')
            end = pos + 8 + size
            assert end <= len(data), f'Truncated {fourcc} chunk'
            chunks.append(fourcc)
            pos = end + (size & 1)
          assert pos == len(data), 'WebP chunk alignment mismatch'
          assert 'ALPH' in chunks or 'VP8L' in chunks, f'No alpha-bearing chunk: {chunks}'

          Path('assets/workout-complete-arm.webp').write_bytes(data)
          print(f'Validated binary transparent WebP: {width}x{height}, {len(data)} bytes, chunks={chunks}')
          PY

      - name: Commit binary asset and remove staging chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workout-complete-arm.webp
          git rm -r .tmp-workout-arm
          git commit -m "Store workout complete hero as binary WebP"
          git push origin HEAD:agent/bicep-workout-complete-hero
