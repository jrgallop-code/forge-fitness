name: Fix workout complete arm asset

on:
  push:
    branches:
      - agent/bicep-workout-complete-hero

permissions:
  contents: write

jobs:
  decode-arm-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bicep-workout-complete-hero
          fetch-depth: 0

      - name: Decode and validate WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('assets/workout-complete-arm.webp')
          raw = path.read_text(encoding='ascii').strip()
          data = base64.b64decode(raw, validate=True)

          assert data[:4] == b'RIFF', 'Missing RIFF signature'
          assert data[8:12] == b'WEBP', 'Missing WEBP signature'
          declared_size = int.from_bytes(data[4:8], 'little') + 8
          print(f'Decoded payload bytes: {len(data)}; declared WebP bytes: {declared_size}')
          assert 12 <= declared_size <= len(data), 'Invalid RIFF declared size'
          webp = data[:declared_size]

          assert webp[12:16] == b'VP8X', 'Expected extended WebP container'
          assert webp[20] & 0x10, 'Expected alpha/transparency flag'
          width = 1 + int.from_bytes(webp[24:27], 'little')
          height = 1 + int.from_bytes(webp[27:30], 'little')
          assert width == 420 and height == 350, f'Unexpected dimensions: {width}x{height}'

          pos = 12
          chunks = []
          while pos < len(webp):
            assert pos + 8 <= len(webp), f'Truncated chunk header at {pos}'
            fourcc = webp[pos:pos+4].decode('ascii', errors='strict')
            size = int.from_bytes(webp[pos+4:pos+8], 'little')
            data_end = pos + 8 + size
            assert data_end <= len(webp), f'Truncated {fourcc} chunk'
            chunks.append(fourcc)
            pos = data_end + (size & 1)
          assert pos == len(webp), 'WebP chunk alignment mismatch'
          assert any(chunk in chunks for chunk in ('ALPH', 'VP8L')), 'No alpha-bearing WebP chunk found'

          trailing = len(data) - declared_size
          print(f'Validated chunks: {chunks}; trailing decoded bytes ignored: {trailing}')
          path.write_bytes(webp)
          print(f'Validated binary transparent WebP: {width}x{height}, {len(webp)} bytes')
          PY

      - name: Commit binary asset and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workout-complete-arm.webp
          git rm .github/workflows/fix-workout-complete-arm.yml
          git commit -m "Store workout complete hero as binary WebP"
          git push origin HEAD:agent/bicep-workout-complete-hero
